services:
  profile:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS website origin}
      DATA_DIR: /app/data
    volumes:
      - profile-data:/app/data
volumes:
  profile-data:
